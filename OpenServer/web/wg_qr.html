<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WireGuard QR Generator</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:20px;}
    textarea{width:100%;height:200px;font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace}
    button{padding:8px 12px}
    #qr{margin-top:12px}
  </style>
  <script>
    function renderQRTo(element, text){
      if (window.QRCode) {
        const canvas = document.createElement('canvas');
        element.appendChild(canvas);
        QRCode.toCanvas(canvas, text, {width:256, margin:1}, (err)=>{ if(err) alert(err); });
      } else {
        const img = document.createElement('img');
        img.width=256; img.height=256;
        img.alt='QR';
        img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=256x256&data=' + encodeURIComponent(text);
        element.appendChild(img);
      }
    }
    function makeQR(){
      const cfg = document.getElementById('cfg').value.trim();
      const box = document.getElementById('qr');
      box.innerHTML='';
      if(!cfg) return;
      renderQRTo(box, cfg);
    }
  </script>
</head>
<body>
  <h1>Генерация QR для WireGuard</h1>
  <p>Вставьте конфиг клиента WireGuard и нажмите «Сгенерировать QR».</p>
  <textarea id="cfg" placeholder="[Interface]
PrivateKey = ...
Address = 10.66.66.2/32
DNS = 1.1.1.1

[Peer]
PublicKey = ...
Endpoint = 45.151.183.153:51820
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25"></textarea>
  <div>
    <button onclick="makeQR()">Сгенерировать QR</button>
  </div>
  <div id="qr"></div>
</body>
</html>

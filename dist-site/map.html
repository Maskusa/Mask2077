<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mask2077 · Карта</title>
    <meta
      name="description"
      content="Карта прогресса по главам книги «Маск 2077». Следите за открытыми и заблокированными сценами."
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&family=Alice&family=Droid+Serif&family=PT+Sans&family=Comfortaa:wght@600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-primary="map">
    <div class="app app--reader" style="max-width: 611.653px; width: 100%;">
      <main class="screen screen--primary screen--map scrollview--no-scrollbar">
        <header class="screen__header">
          <h1 id="map-title">Карта прогресса</h1>
          <p class="screen__subtext">Следите за открытыми и закрытыми главами</p>
        </header>

        <div class="map" aria-labelledby="map-title">
          <aside class="map__progress">
            <div class="map-progress" data-map-progress>
              <div class="map-progress__layout">
                <div class="map-progress__track" data-map-progress-track>
                  <div class="map-progress__fill" data-map-progress-fill></div>
                  <div class="map-progress__markers" data-map-progress-markers aria-hidden="true"></div>
                  <div class="map-progress__pointer" data-map-progress-pointer role="presentation" aria-hidden="true">
                    <span class="map-progress__pointer-flag">&#9654;</span>
                  </div>
                </div>
                <div class="map-progress__labels" data-map-progress-labels aria-hidden="true"></div>
              </div>
            </div>
          </aside>

          <div class="map__column" data-map-column></div>
        </div>
      </main>

            <nav class="primary-nav" aria-label="Основная навигация">
        <a class="primary-nav__item" data-primary="store" href="store.html">
          <span class="primary-nav__icon">🛒</span>
          <span class="primary-nav__label">Магазин</span>
          <span class="primary-nav__arrow primary-nav__arrow--right" aria-hidden="true">&#8250;</span>
        </a>
        <a class="primary-nav__item" data-primary="map" href="map.html">
          <span class="primary-nav__icon">🗺️</span>
          <span class="primary-nav__label">Карта</span>
          <span class="primary-nav__arrow primary-nav__arrow--left" aria-hidden="true">&#8249;</span>
          <span class="primary-nav__arrow primary-nav__arrow--right" aria-hidden="true">&#8250;</span>
        </a>
        <a class="primary-nav__item" data-primary="lobby" href="index.html">
          <span class="primary-nav__icon">🏠</span>
          <span class="primary-nav__label">Лобби</span>
          <span class="primary-nav__arrow primary-nav__arrow--left" aria-hidden="true">&#8249;</span>
          <span class="primary-nav__arrow primary-nav__arrow--right" aria-hidden="true">&#8250;</span>
        </a>
        <a class="primary-nav__item" data-primary="ivy" href="ivy.html">
          <span class="primary-nav__icon">🤖</span>
          <span class="primary-nav__label">Айви</span>
          <span class="primary-nav__arrow primary-nav__arrow--left" aria-hidden="true">&#8249;</span>
          <span class="primary-nav__arrow primary-nav__arrow--right" aria-hidden="true">&#8250;</span>
        </a>
        <a class="primary-nav__item" data-primary="settings" href="settings.html">
          <span class="primary-nav__icon">⚙️</span>
          <span class="primary-nav__label">Настройки</span>
          <span class="primary-nav__arrow primary-nav__arrow--left" aria-hidden="true">&#8249;</span>
        </a>
      </nav>
    </div>

    <dialog id="locked-modal" class="modal">
      <form method="dialog" class="modal__content">
        <h3>Глава заблокирована!</h3>
        <p>
          Вы можете открыть главу после прочтения предыдущей. Или оформите премиальный пропуск, чтобы получить
          мгновенный доступ.
        </p>
        <div class="modal__actions">
          <button value="cancel" class="btn btn--ghost">Не открывать</button>
          <button value="store" class="btn btn--accent">Открыть</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="./js/common.js"></script>
    <script type="module" src="./js/map.js"></script>
  </body>
</html>
